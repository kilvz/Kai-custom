name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls -la $ANDROID_SDK_ROOT/ 2>/dev/null || true
          ls -la $ANDROID_SDK_ROOT/cmdline-tools/ 2>/dev/null || true
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$ANDROID_SDK_ROOT/tools/bin/sdkmanager
          fi
          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at expected paths"
            ls -la $ANDROID_SDK_ROOT/
            exit 1
          fi
          yes | $SDKMANAGER "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tail -10
          yes | $SDKMANAGER --licenses 2>&1 | tail -5 || true
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      - name: Build APK
        run: bash ./gradlew :androidApp:assembleFossRelease --stacktrace --no-daemon
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.KEYSTORE_B64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/foss/release/*-signed.apk

  dmg:
    name: Generate DMG
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DMG
        run: bash ./gradlew packageReleaseDmg --stacktrace --no-daemon --no-configuration-cache
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-package
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  msi:
    name: Generate MSI
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build MSI
        run: ./gradlew packageReleaseMsi --stacktrace --no-daemon --no-configuration-cache
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

  deb:
    name: Generate DEB
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install DEB packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build DEB
        run: ./gradlew packageReleaseDeb --stacktrace --no-daemon --no-configuration-cache
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

  rpm:
    name: Generate RPM
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: ./gradlew packageReleaseRpm --stacktrace --no-daemon --no-configuration-cache
      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: composeApp/build/compose/binaries/main-release/rpm/*.rpm

  linux-tar:
    name: Generate Linux Tarball
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace --no-daemon -Dorg.gradle.jvmargs=-Xmx6g --no-configuration-cache
      - name: Create tarball
        run: |
          cd composeApp/build/compose/binaries/main-release/app
          tar czf "$GITHUB_WORKSPACE/k.ai-linux-x86_64.tar.gz" k.ai
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-package
          path: k.ai-linux-x86_64.tar.gz

  appimage:
    name: Generate AppImage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace --no-daemon -Dorg.gradle.jvmargs=-Xmx6g --no-configuration-cache
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r composeApp/build/compose/binaries/main-release/app/k.ai/* AppDir/usr/lib/

          cp composeApp/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/kai.png
          cp composeApp/icon.png AppDir/kai.png

          cat > AppDir/kai.desktop << 'EOF'
          [Desktop Entry]
          Name=k.ai
          Comment=AI Assistant Application
          Exec=k.ai
          Icon=kai
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cp AppDir/kai.desktop AppDir/usr/share/applications/

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/lib/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/lib/runtime/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/lib/bin/k.ai" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir k.ai-x86_64.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: k.ai-*.AppImage

  release:
    name: Release APK
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-apk

      - name: List downloaded files (for debugging)
        run: ls -la

      - name: Rename assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in androidApp-foss-*-release-signed.apk; do
            [ -f "$f" ] || continue
            abi=$(echo "$f" | sed 's/androidApp-foss-\(.*\)-release-signed\.apk/\1/')
            mv "$f" "k.ai-${VERSION}-android-${abi}.apk"
          done

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${GITHUB_REF_NAME}" > changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --no-merges > changelog.txt
            fi
          fi

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          files: k.ai-*
