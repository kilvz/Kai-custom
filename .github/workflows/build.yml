name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;29.0.14206865"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleFossDebug --no-daemon

    - name: Upload ARM v8 APK
      uses: actions/upload-artifact@v4
      with:
        name: kai-custom-arm64-v8a
        path: androidApp/build/outputs/apk/foss/debug/*arm64-v8a*.apk

    - name: Upload ARM v7 APK
      uses: actions/upload-artifact@v4
      with:
        name: kai-custom-armeabi-v7a
        path: androidApp/build/outputs/apk/foss/debug/*armeabi-v7a*.apk

    - name: Upload All APKs
      uses: actions/upload-artifact@v4
      with:
        name: kai-custom-all-apks
        path: androidApp/build/outputs/apk/foss/debug/*.apk
